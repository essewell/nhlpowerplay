# Netlify build for apps/web (Next.js App Router) in the pnpm monorepo.
# Site: powerplay-game, linked to essewell/nhlpowerplay with base directory = repo root and
# package directory = apps/web (Netlify's monorepo mode). Netlify reads this file from the package
# directory, but runs the command and resolves `publish` from the base (repo root).
# The Next.js runtime (@netlify/plugin-nextjs) is added automatically; do not pin it.

[build]
  command = "pnpm --filter @powerplay/web build"   # prebuild: no synthetic fixtures; postbuild: same check over .next
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"          # scripts run .ts natively (Node >= 22.18); matches .nvmrc and CI
  PNPM_VERSION = "10.4.1"      # matches packageManager in the root package.json

# Deploy previews and branch deploys also get X-Robots-Tag: noindex from next.config.ts.
